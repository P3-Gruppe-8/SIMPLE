<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NOWACO SIMPLE</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" href="nowaco-logo.png" type="image/png" />
    </head>
    <body>
        <header>
            <nav class="navbar">
                <ol>
                    <li class="navbar-element">
                        <img src="nowaco-logo.png" />
                    </li>
                    <li class="navbar-element">
                        <div class="mode-switch" id="modeSwitch">
                            <div class="mode-slider"></div>
                            <button
                                class="mode-option active"
                                data-mode="supply"
                            >
                                Supply Mode
                            </button>
                            <button class="mode-option" data-mode="loan">
                                Loan Mode
                            </button>
                        </div>
                    </li>
                </ol>
            </nav>
        </header>
        <main>
            <!-- The default view -->
            <div class="view button-col" id="defaultView">
                <div class="button-row height-two-fifths">
                    <button class="menu-button raised default-option">
                        <img
                            src="share-from-square-solid-full.svg"
                            class="button-icon"
                        />
                        <p class="button-label">Write Off</p>
                    </button>
                </div>

                <div class="button-row height-two-fifths">
                    <button class="menu-button raised">
                        <img
                            src="box-open-solid-full.svg"
                            class="button-icon"
                        />
                        <p class="button-label">Restock</p>
                    </button>
                </div>

                <div class="button-row height-one-fifth">
                    <button
                        onclick="showView('detailedSupply', true)"
                        id="moreOptions"
                        class="menu-button raised invisible"
                    >
                        <img src="bars-solid-full.svg" class="button-icon" />
                        <p class="button-label">More options</p>
                    </button>
                    <button id="scanIdPrompt" class="menu-button">
                        <img src="id-card-solid-full.svg" class="button-icon" />
                        <p class="button-label detailed">
                            Scan ID for more options...
                        </p>
                    </button>
                </div>
            </div>

            <!-- Alert view -->
            <div class="view" id="alertView">
                <div id="newAlerts" class="alert-row-new">New Alerts</div>
                <div id="oldAlerts" class="alert-row-old">Old Alerts</div>
            </div>

            <!-- After pressing "more options" in supply mode -->
            <div class="view button-col" id="detailedSupply">
                <div class="button-row height-two-fifths">
                    <button class="menu-button raised">
                        <img src="plus-solid-full.svg" class="button-icon" />
                        <p class="button-label">Register Item Type</p>
                    </button>
                    <button class="menu-button raised">
                        <img src="minus-solid-full.svg" class="button-icon" />
                        <p class="button-label">Delete Item Type</p>
                    </button>
                </div>

                <div class="button-row height-two-fifths">
                    <button class="menu-button raised">
                        <img
                            src="list-check-solid-full.svg"
                            class="button-icon"
                        />
                        <p class="button-label">Count Inventory</p>
                    </button>
                    <button class="menu-button raised">
                        <img
                            src="right-left-solid-full.svg"
                            class="button-icon"
                        />
                        <p class="button-label">Edit Item Type Locations</p>
                    </button>
                </div>

                <div class="button-row height-one-fifth">
                    <button class="menu-button raised">
                        <img
                            src="circle-info-solid-full.svg"
                            class="button-icon"
                        />
                        <p class="button-label">Item Details</p>
                    </button>
                </div>
            </div>
        </main>
        <footer class="bottombar">
            <button
                onclick="previousView()"
                class="back raised"
                id="backButton"
            >
                <img src="back-arrow.png" class="button-icon" />
            </button>
            <button
                onclick="logOut()"
                class="back raised invisible"
                id="logoutButton"
            >
                <p>Log out</p>
            </button>
            <button
                class="alerts raised"
                id="alertButton"
                onclick="showAlertView('alertView', true)"
            >
                <img src="bell-solid-full.svg" class="button-icon" />
                <p class="button-label">Alerts</p>
            </button>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
