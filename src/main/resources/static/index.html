<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NOWACO SIMPLE</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" href="images/nowaco-logo.png" type="image/png" />
    </head>
    <body>
        <header>
            <nav class="navbar">
                <ol>
                    <li class="navbar-element">
                        <img src="images/nowaco-logo.png" />
                    </li>
                    <li class="navbar-element">
                        <div class="mode-switch" id="modeSwitch">
                            <div class="mode-slider"></div>
                            <button
                                class="mode-option active"
                                data-mode="supplyMode"
                            >
                                Supply Mode
                            </button>
                            <button class="mode-option" data-mode="loanMode">
                                Loan Mode
                            </button>
                        </div>
                    </li>
                </ol>
            </nav>
        </header>
        <main>
            <div class="mode" id="supplyMode">
                <!-- The default supply mode view -->
                <div class="view button-col" id="defaultView">
                    <div class="button-row height-two-fifths">
                        <button class="menu-button raised default-option">
                            <img
                                src="images/share-from-square-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Write Off</span>
                        </button>
                    </div>

                    <div class="button-row height-two-fifths">
                        <button class="menu-button raised">
                            <img
                                src="images/box-open-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Restock</span>
                        </button>
                    </div>

                    <div class="button-row height-one-fifth">
                        <button
                            data-view="detailedSupply"
                            id="moreOptions"
                            class="menu-button raised invisible"
                        >
                            <img
                                src="images/bars-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">More options</span>
                        </button>
                        <button id="scanIdPrompt" class="menu-button">
                            <img
                                src="images/id-card-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label detailed">
                                Scan ID for more options...
                            </span>
                        </button>
                    </div>
                </div>

                <!-- Alert view -->
                <div class="view" id="alertView">
                    <div id="newAlerts" class="alert-row-new">New Alerts</div>
                    <div id="oldAlerts" class="alert-row-old">Old Alerts</div>
                </div>

                <!-- After pressing "more options" in supply mode -->
                <div class="view button-col" id="detailedSupply">
                    <div class="button-row height-two-fifths">
                        <button
                            command="show-modal"
                            commandfor="register-consumable-dialog"
                            class="menu-button raised"
                        >
                            <img
                                src="images/plus-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Register Item Type</span>
                        </button>
                        <dialog id="register-consumable-dialog">
                            <form
                                id="register-consumable-dialog-form"
                                method="dialog"
                            >
                                <div class="dialog-body">
                                    <h2>Register Item Type</h2>
                                    <p>Register a new item type.</p>
                                    <div class="form-field">
                                        <label for="item-type-name"
                                            >Item Type Name</label
                                        >
                                        <input
                                            type="text"
                                            id="item-type-name"
                                        />
                                    </div>
                                    <div class="form-field">
                                        <label for="item-id">Item ID</label>
                                        <div class="barcode-field">
                                            <div class="barcode-buttons">
                                                <button
                                                    type="button"
                                                    class="barcode-scan raised"
                                                >
                                                    <span
                                                        class="barcode-scan-label"
                                                        >Scan barcode</span
                                                    >
                                                </button>
                                                <button
                                                    type="button"
                                                    class="barcode-manual raised"
                                                    title="Manual entry"
                                                    aria-label="Manual entry"
                                                >
                                                    <img
                                                        src="images/keyboard-solid-full.svg"
                                                        class="barcode-manual-icon"
                                                    />
                                                </button>
                                            </div>
                                            <input
                                                type="text"
                                                id="item-id"
                                                class="invisible"
                                            />
                                        </div>
                                    </div>
                                    <div class="form-field">
                                        <label for="item-type-shelf"
                                            >Shelf</label
                                        >
                                        <select
                                            id="item-type-shelf"
                                            class="shelf-select"
                                            required
                                        >
                                            <option value="" disabled selected>
                                                Loading shelves...
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="dialog-footer">
                                    <button
                                        type="button"
                                        commandfor="register-consumable-dialog"
                                        command="close"
                                        class="red raised"
                                    >
                                        <span>Cancel</span>
                                    </button>
                                    <button type="submit" class="green raised">
                                        <span>Apply</span>
                                    </button>
                                </div>
                            </form>
                        </dialog>
                        <button class="menu-button raised">
                            <img
                                src="images/minus-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Delete Item Type</span>
                        </button>
                    </div>

                    <div class="button-row height-two-fifths">
                        <button class="menu-button raised">
                            <img
                                src="images/list-check-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Count Inventory</span>
                        </button>
                        <button class="menu-button raised">
                            <img
                                src="images/right-left-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Edit Item Type Locations</span>
                        </button>
                    </div>

                    <div class="button-row height-one-fifth">
                        <button class="menu-button raised">
                            <img
                                src="images/circle-info-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Item Details</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="mode" id="loanMode">
                <div class="view login-prompt" id="loanModeLogInScreen">
                    <img
                        src="images/id-card-solid-full.svg"
                        class="button-icon"
                    />
                    <p class="button-label">Scan ID to proceed...</p>
                </div>
                <!-- Loan menu home screen -->
                <div class="view button-col" id="loanModeHomeScreen">
                    <div class="button-row height-two-fifths">
                        <button class="menu-button raised default-option">
                            <img
                                src="images/share-from-square-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">New Loan</span>
                        </button>
                    </div>

                    <div class="button-row height-two-fifths">
                        <button class="menu-button raised default-option">
                            <img
                                src="images/left-long-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Return Item</span>
                        </button>
                    </div>

                    <div class="button-row height-one-fifth">
                        <button
                            data-view="detailedLoan"
                            class="menu-button raised"
                        >
                            <img
                                src="images/bars-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">More Options</span>
                        </button>
                    </div>
                </div>

                <!-- After pressing "More Options" in loan mode -->
                <div class="view button-col" id="detailedLoan">
                    <div class="button-row height-two-fifths">
                        <button class="menu-button raised">
                            <img
                                src="images/plus-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Add New Item</span>
                        </button>
                        <button class="menu-button raised">
                            <img
                                src="images/calendar-plus-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Extend Loan</span>
                        </button>
                    </div>

                    <div class="button-row height-two-fifths">
                        <button class="menu-button raised">
                            <img
                                src="images/list-check-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Count Inventory</span>
                        </button>
                        <button class="menu-button raised">
                            <img
                                src="images/minus-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Delete Item</span>
                        </button>
                    </div>

                    <div class="button-row height-one-fifth">
                        <button class="menu-button raised">
                            <img
                                src="images/right-left-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Move Item</span>
                        </button>
                        <button class="menu-button raised">
                            <img
                                src="images/circle-info-solid-full.svg"
                                class="button-icon"
                            />
                            <span class="button-label">Item Details</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <footer class="bottombar">
            <button class="red back raised" id="backButton">
                <img src="images/back-arrow.png" class="button-icon" />
            </button>
            <button class="red back raised invisible" id="logoutButton">
                <span>Log out</span>
            </button>
            <button class="alerts raised" id="alertButton">
                <img src="images/bell-solid-full.svg" class="button-icon" />
                <span class="button-label">Alerts</span>
            </button>
        </footer>
        <div id="toasts" class="toasts"></div>
        <template id="toast-template">
            <button type="button" class="toast raised">
                <img src="images/check-solid-full.svg" class="toast-icon" />
                <span class="toast-message"></span>
            </button>
        </template>
        <script type="module" src="js/script.js"></script>
    </body>
</html>
