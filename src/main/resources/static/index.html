<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NOWACO SIMPLE</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" href="nowaco-logo.png" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header>
            <nav class="navbar">
                <ol>
                    <li class="navbar-element">
                        <img src="nowaco-logo.png" />
                    </li>
                    <li class="navbar-element">
                        <div class="mode-switch" id="modeSwitch">
                            <div class="mode-slider"></div>
                            <button
                                class="mode-option active"
                                data-mode="supply"
                            >
                                Supply Mode
                            </button>
                            <button class="mode-option" data-mode="loan">
                                Loan Mode
                            </button>
                        </div>
                    </li>
                </ol>
            </nav>
        </header>
        <main>
            <div class="button-row height-two-fifths">
                <button class="menu-button">
                    <img src="plus-solid-full.svg" class="button-icon" />
                    <p class="button-label">Register Item Type</p>
                </button>
                <button class="menu-button">
                    <img src="minus-solid-full.svg" class="button-icon" />
                    <p class="button-label">Delete Item Type</p>
                </button>
            </div>

            <div class="button-row height-two-fifths">
                <button class="menu-button">
                    <img src="list-check-solid-full.svg" class="button-icon" />
                    <p class="button-label">Count Inventory</p>
                </button>
                <button class="menu-button">
                    <img src="right-left-solid-full.svg" class="button-icon" />
                    <p class="button-label">Edit Item Type Locations</p>
                </button>
            </div>

            <div class="button-row height-one-fifth">
                <button class="menu-button">
                    <img src="circle-info-solid-full.svg" class="button-icon" />
                    <p class="button-label">Item Details</p>
                </button>
            </div>
        </main>
        <footer class="bottombar">
            <button class="back">
                <img src="back-arrow.png" class="button-icon" />
            </button>
            <button class="alerts">
                <img src="bell-solid-full.svg" class="button-icon" />
                <p class="button-label">Alerts</p>
            </button>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
